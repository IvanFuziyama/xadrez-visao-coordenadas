<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/pages/style-index.css">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <h1>XADREZ</h1>
        </nav>
    </header> 
    <main class="main">
        <section class="tabuleiro">
            <div class="card-tabuleiro">
                    <div class="coordenadasNum">
                        <!-- 8 7 6 5 4 3 2 1 -->
                    </div>
                    <div class="coordenadasLetras">
                        <!-- h g e f d c b a -->
                    </div>
                </div>
        </section>
        <section class="pontuacao">
                <div class="pontuacao-card">
                    <div class="pontuacao-card-header">
                        <h1>Visão</h1>
                    </div>
                    <div class="pontuacao-card-main">
                        <h2>Recorde</h2>
                        <p>0</p>
                    </div>
                    <div class="pontuacao-card-footer">
                        <div class="pontuacao-container">
                            <p>Cor:</p>
                            <select name="select-cor" class="select-cor">
                                <option value="Branco">Branco</option>
                                <option value="Preto">Preto</option>
                                <option value="Branco ou Preto">Branco ou Preto</option>
                            </select>
                        </div>
                        <div class="pontuacao-container">
                            <p>Mostrar Coordenadas</p>
                            <input type="checkbox" name="checkbox-mostrar-cod" class="checkbox-mostrar-cod">
                        </div>
                        <button type="button" class="btn-comecar"><span>COMEÇAR</span></button>
                    </div>
                </div>
        </section>
    </main> 
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
